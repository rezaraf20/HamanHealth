<!doctype html>
<!--
  Shown by the Android app when the interface cannot be loaded from
  https://app.hamanhealth.com (no connection, server unreachable).
  It is bundled in the APK and has no access to the native plugin, so it must stay
  self-contained: no external files, no scripts beyond the retry below.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Haman Health</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #f6f8fb; color: #1f2a37;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 22rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { font-size: 0.95rem; line-height: 1.5; margin: 0 0 1rem; color: #52606d; }
      button {
        height: 2.75rem; padding: 0 1.5rem; border: 0; border-radius: 999px;
        background: #1a7a5e; color: #fff; font-size: 0.95rem; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection</h1>
      <p>Haman Health needs the internet to open. A night session that is already running keeps listening, and you can stop it from its notification.</p>
      <p>Your results upload by themselves once you are back online.</p>
      <button type="button" onclick="window.location.replace('https://app.hamanhealth.com/')">Try again</button>
    </main>
  </body>
</html>
