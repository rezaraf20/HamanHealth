# /etc/httpd/conf.d/api.hamanhealth.com.conf
# Apache reverse proxy → haman-api container on 127.0.0.1:8002
# Run: certbot --apache -d api.hamanhealth.com  (after DNS is live)

<VirtualHost *:80>
    ServerName api.hamanhealth.com
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName api.hamanhealth.com

    SSLEngine on
    # Certbot will fill these in:
    # SSLCertificateFile    /etc/letsencrypt/live/api.hamanhealth.com/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/api.hamanhealth.com/privkey.pem

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8002/
    ProxyPassReverse / http://127.0.0.1:8002/

    # WebSocket support (for future real-time features)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:8002/$1 [P,L]

    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog  /var/log/httpd/api.hamanhealth.com-error.log
    CustomLog /var/log/httpd/api.hamanhealth.com-access.log combined
</VirtualHost>
